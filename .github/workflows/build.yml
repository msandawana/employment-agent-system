name: Build Windows EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller bcrypt openpyxl reportlab pillow
        
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --name "Employment Agent System" --add-data "logo.png;." employment_agent_gui.py
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-EXE
        path: dist/
